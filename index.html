<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>Target Batch Test Ver.3</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:#111;background:#f5f5f7
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #ddd;
  padding:10px 14px
}
.header-inner{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:19px;margin:0}
.wrap{max-width:980px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
label{font-size:13px;color:#555;display:block}
input,select,textarea{
  width:100%;border:1px solid #bbb;border-radius:10px;padding:11px;background:#fff;
  font-size:16px
}
button{
  border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;
  font-weight:750;cursor:pointer
}
button.secondary{background:#e9e9ec;color:#111}
button.warning{background:#9a6200}
button.danger{background:#a30000}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.small{font-size:12px;color:#666;line-height:1.55}
.notice{padding:10px 12px;border-radius:10px;background:#f0f4ff;font-size:13px}
.hidden{display:none!important}
.top-status{display:flex;gap:12px;align-items:center;font-size:13px;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:850;font-size:18px}
.progressbar{height:8px;background:#e8e8eb;border-radius:999px;overflow:hidden;margin:8px 0 4px}
.progressbar>div{height:100%;background:#111;width:0%}
.test-tools{
  position:sticky;top:52px;z-index:10;background:#fff;
  border:1px solid #ddd;border-radius:14px;padding:10px 12px;margin-bottom:10px
}
.test-tools-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qrow{
  display:grid;grid-template-columns:54px 155px minmax(0,1fr);
  gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee
}
.qrow:last-child{border-bottom:0}
.qnum{color:#666;text-align:right;font-variant-numeric:tabular-nums}
.word{font-weight:750;font-size:18px}
.qrow input{padding:10px}
.qrow.unanswered input{border-color:#b66500;background:#fffaf0}
.qrow.answered input{border-color:#8ca58d}
.sticky-submit{
  position:sticky;bottom:10px;display:flex;justify-content:flex-end;
  pointer-events:none;z-index:15
}
.sticky-submit button{pointer-events:auto;box-shadow:0 5px 22px rgba(0,0,0,.22)}
.stats{font-size:20px;font-weight:850;line-height:1.6}
.result{
  border-left:5px solid #999;padding:11px 12px;margin:9px 0;background:#fafafa;border-radius:9px
}
.result.bad{border-left-color:#b00020}
.result.mid{border-left-color:#c77c00}
.result.qmark{border-left-color:#0057b8}
.badge{
  display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;
  font-weight:850;background:#eee;margin-right:6px
}
.result-meta{font-size:13px;color:#666;margin-top:5px}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabbar button{padding:8px 11px}
.tabbar button.active{background:#111;color:#fff}
.tabbar button:not(.active){background:#eee;color:#111}
.history-table{width:100%;border-collapse:collapse;font-size:13px}
.history-table th,.history-table td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.mono{font-variant-numeric:tabular-nums}
@media(max-width:650px){
  .grid{grid-template-columns:1fr 1fr}
  .qrow{grid-template-columns:42px 102px minmax(0,1fr);gap:7px}
  .word{font-size:16px}
  .wrap{padding:9px}
  .card{padding:12px}
  .top-status{gap:7px;font-size:12px}
}

.bottom-tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid #d8d8dc;padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
}
.bottom-tabs button{
  background:transparent;color:#666;padding:8px 4px;border-radius:9px;font-size:13px
}
.bottom-tabs button.active{background:#111;color:#fff}
body{padding-bottom:76px}
.weak-card{
  border:1px solid #ddd;border-radius:13px;padding:12px;margin:9px 0;background:#fff
}
.weak-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.weak-title{font-size:18px;font-weight:850}
.weak-score{font-weight:900;font-size:15px}
.weak-bar{height:8px;background:#e7e7ea;border-radius:999px;overflow:hidden;margin:8px 0}
.weak-bar>div{height:100%;background:#111}
.weak-meta{font-size:13px;color:#555;line-height:1.6}
.weak-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.weak-controls button{padding:8px 10px}
.empty-state{padding:28px 12px;text-align:center;color:#666}

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:8px"><h1>Target Batch Test</h1><span style="font-size:12px;font-weight:800;background:#111;color:#fff;padding:3px 8px;border-radius:999px">Ver.3</span></div>
    <div class="top-status">
      <span id="unansweredTop"></span>
      <span id="timerTop" class="timer"></span>
    </div>
  </div>
</header>

<main class="wrap">
<section id="setup" class="card">
  <h2 style="margin-top:0">テスト設定</h2>
  <div id="resumeBox" class="notice hidden">
    途中保存されたテストがあります。
    <div class="actions">
      <button id="resumeBtn">続きから再開</button>
      <button class="secondary" id="discardDraftBtn">途中データを破棄</button>
    </div>
  </div>

  <div class="grid" style="margin-top:12px">
    <label>開始番号<input id="startNo" type="number" value="301"></label>
    <label>終了番号<input id="endNo" type="number" value="400"></label>
    <label>出題数<input id="count" type="number" value="100" min="1"></label>
    <label>制限時間（分・0で無制限）<input id="minutes" type="number" value="5" min="0"></label>
    <label>出題順
      <select id="order">
        <option value="normal">番号順</option>
        <option value="random">ランダム</option>
      </select>
    </label>
    <label>出題対象
      <select id="mode">
        <option value="range">指定範囲</option>
        <option value="weak">苦手単語のみ</option>
        <option value="qmark">「？」履歴のみ</option>
        <option value="never">未出題のみ</option>
        <option value="wrong2">×が2回以上</option>
      </select>
    </label>
  </div>

  <div class="actions">
    <button id="startBtn">テスト開始</button>
    <button class="secondary" id="showHistoryBtn">学習状況</button>
  </div>

  <details style="margin-top:14px">
    <summary><b>データ管理</b></summary>
    <div class="actions">
      <button class="secondary" id="exportAllBtn">全データを書き出す</button>
      <button class="secondary" id="importAllBtn">全データを読み込む</button>
      <button class="secondary" id="exportWordsBtn">単語データだけ書き出す</button>
      <button class="secondary" id="importWordsBtn">単語データだけ読み込む</button>
      <input id="fileInputAll" type="file" accept=".json" class="hidden">
      <input id="fileInputWords" type="file" accept=".json" class="hidden">
      <button class="danger" id="clearHistory">学習履歴を消去</button>
    </div>
  </details>

  <p class="small">
    回答末尾に「？」を付けると、○でも確認対象として別表示します。Enterで次の欄へ移動します。
    入力内容は端末内に自動保存されます。
  </p>
</section>

<section id="test" class="hidden">
  <div class="test-tools">
    <div class="test-tools-row">
      <div><b id="progressText"></b><div class="small" id="saveState">自動保存中</div></div>
      <div class="actions" style="margin-top:0">
        <button class="secondary" id="jumpFirstBlank">最初の未回答へ</button>
        <button class="secondary" id="saveExitBtn">保存して戻る</button>
      </div>
    </div>
    <div class="progressbar"><div id="progressFill"></div></div>
  </div>
  <div class="card"><div id="questions"></div></div>
  <div class="sticky-submit"><button id="submitBtn">採点する</button></div>
</section>

<section id="results" class="hidden">
  <div class="card">
    <div id="stats" class="stats"></div>
    <div class="actions">
      <button id="retryWeak">今回の△・×だけ再テスト</button>
      <button class="secondary" id="backBtn">設定へ戻る</button>
    </div>
  </div>

  <div id="reviewQ" class="card hidden">
    <h2>○だが「？」付き</h2>
    <div id="qmarkResults"></div>
  </div>

  <div id="reviewBad" class="card">
    <h2>△・×</h2>
    <div class="tabbar">
      <button id="tabAll" class="active">すべて</button>
      <button id="tabMid">△のみ</button>
      <button id="tabBad">×のみ</button>
    </div>
    <div id="badResults"></div>
  </div>
</section>

<section id="history" class="hidden">
  <div class="card">
    <h2 style="margin-top:0">学習状況</h2>
    <div id="historySummary" class="stats"></div>
    <div class="actions">
      <button class="secondary" id="historyBackBtn">設定へ戻る</button>
    </div>
  </div>
  <div class="card">
    <table class="history-table">
      <thead><tr><th>単語</th><th>苦手度</th><th>回数</th><th>○</th><th>△</th><th>×</th><th>最終</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</section>

<section id="weaklist" class="hidden">
  <div class="card">
    <h2 style="margin-top:0">苦手リスト</h2>
    <div id="weakSummary" class="stats"></div>
    <div class="grid" style="margin-top:12px">
      <label>並び順
        <select id="weakSort">
          <option value="score">苦手度が高い順</option>
          <option value="recent">直近でミスした順</option>
          <option value="wrong">×回数が多い順</option>
          <option value="number">単語番号順</option>
        </select>
      </label>
      <label>表示
        <select id="weakFilter">
          <option value="all">すべて</option>
          <option value="severe">苦手度70以上</option>
          <option value="manual">固定登録のみ</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <button id="testWeakListBtn">表示中の単語をテスト</button>
      <button class="secondary" id="refreshWeakBtn">再計算</button>
    </div>
  </div>
  <div id="weakListBody"></div>
</section>

</main>


<nav class="bottom-tabs">
  <button id="tabHome" class="active">ホーム</button>
  <button id="tabWeak">苦手リスト</button>
  <button id="tabStats">学習状況</button>
</nav>

<script>
const DEFAULT_WORDS = [{"number": 301, "word": "predict", "answers": ["予測する", "予言する", "予想する"]}, {"number": 302, "word": "examine", "answers": ["調べる", "検査する", "診察する", "考察する"]}, {"number": 303, "word": "trust", "answers": ["信頼する", "信用する", "信頼", "信用"]}, {"number": 304, "word": "stick", "answers": ["くっつく", "貼り付ける", "突き刺す", "棒", "固執する"]}, {"number": 305, "word": "emerge", "answers": ["現れる", "出現する", "明らかになる", "浮かび上がる"]}, {"number": 306, "word": "vary", "answers": ["異なる", "変わる", "変化する"]}, {"number": 307, "word": "release", "answers": ["解放する", "放出する", "発売する", "発表する", "解放"]}, {"number": 308, "word": "divide", "answers": ["分ける", "分割する", "割る", "隔てる"]}, {"number": 309, "word": "enable", "answers": ["可能にする", "できるようにする"]}, {"number": 310, "word": "judge", "answers": ["判断する", "裁く", "裁判官", "判定する"]}, {"number": 311, "word": "rely", "answers": ["頼る", "依存する", "信頼する"]}, {"number": 312, "word": "engage", "answers": ["従事する", "参加する", "引き込む", "雇う"]}, {"number": 313, "word": "shift", "answers": ["移す", "移動する", "変える", "変化", "交代"]}, {"number": 314, "word": "adopt", "answers": ["採用する", "採択する", "養子にする"]}, {"number": 315, "word": "acquire", "answers": ["獲得する", "得る", "習得する", "身につける"]}, {"number": 316, "word": "expand", "answers": ["拡大する", "広げる", "膨張する"]}, {"number": 317, "word": "refuse", "answers": ["拒む", "拒否する", "断る"]}, {"number": 318, "word": "strike", "answers": ["打つ", "襲う", "ぶつかる", "ストライキ", "印象を与える"]}, {"number": 319, "word": "repeat", "answers": ["繰り返す", "反復する"]}, {"number": 320, "word": "consume", "answers": ["消費する", "食べる", "使い果たす"]}, {"number": 321, "word": "confuse", "answers": ["混乱させる", "困惑させる", "取り違える"]}, {"number": 322, "word": "select", "answers": ["選ぶ", "選択する", "選び出す"]}, {"number": 323, "word": "evolve", "answers": ["進化する", "発展する", "徐々に発達する"]}, {"number": 324, "word": "convince", "answers": ["納得させる", "確信させる", "説得する"]}, {"number": 325, "word": "recall", "answers": ["思い出す", "呼び戻す", "回収する", "記憶"]}, {"number": 326, "word": "destroy", "answers": ["破壊する", "滅ぼす"]}, {"number": 327, "word": " const $ = id => document.getElementById(id);

function loadJSON(key, fallback){

    const x = JSON.parse(localStorage.getItem(key));
    return x ?? fallback;
  }catch{return fallback}
}
function saveCore(){
  localStorage.setItem(STORAGE.words, JSON.stringify(words));
  localStorage.setItem(STORAGE.stats, JSON.stringify(stats));
  localStorage.setItem(STORAGE.qmark, JSON.stringify([...qhistory]));
  localStorage.setItem(STORAGE.sessions, JSON.stringify(sessions.slice(-200)));
  localStorage.setItem(STORAGE.manualWeak, JSON.stringify([...manualWeak]));
  localStorage.setItem(STORAGE.removedWeak, JSON.stringify([...removedWeak]));
}
function normalize(s){
  return (s||"")
    .replace(/[？?]\s*$/,"")
    .replace(/\s+/g,"")
    .replace(/[。、・，,]/g,"")
    .toLowerCase();
}
function grade(answer,candidates){
  const a = normalize(answer);
  if(!a) return "×";
  const cs = candidates.map(normalize).filter(Boolean);

  if(cs.some(c => a===c)) return "○";
  if(cs.some(c => a.includes(c) || (c.includes(a) && a.length>=2))) return "○";

  const stems = cs.flatMap(c =>
    c.split(/する|した|して|の|な|に|で|を|と|へ|が|は/)
      .filter(x=>x.length>=2)
  );
  if(stems.some(x=>a.includes(x) || x.includes(a))) return "△";
  return "×";
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function statFor(n){
  if(!stats[n]) stats[n]={attempts:0,correct:0,partial:0,wrong:0,lastGrade:"",lastAnswer:"",lastTested:"",lastMistakeAt:"",correctStreak:0};
  if(stats[n].correctStreak==null)stats[n].correctStreak=0;
  if(stats[n].lastMistakeAt==null)stats[n].lastMistakeAt="";
  return stats[n];
}
function daysSince(iso){
  if(!iso)return 999;
  return Math.max(0,(Date.now()-new Date(iso).getTime())/86400000);
}
function weaknessScore(n){
  const s=statFor(n);
  const total=Math.max(1,s.attempts);
  const errorRate=(s.wrong+s.partial*0.55)/total;
  const recency=s.lastMistakeAt ? Math.max(0,1-daysSince(s.lastMistakeAt)/30) : 0;
  const volume=Math.min(1,(s.wrong+s.partial*0.6)/5);
  const streakRelief=Math.min(18,(s.correctStreak||0)*6);
  let score=Math.round(errorRate*50+recency*30+volume*20-streakRelief);
  if(manualWeak.has(n))score=Math.max(score,70);
  if(removedWeak.has(n) && !manualWeak.has(n))score=0;
  return Math.max(0,Math.min(100,score));
}
function weakLabel(score){
  if(score>=85)return "かなり苦手";
  if(score>=70)return "苦手";
  if(score>=50)return "やや苦手";
  if(score>=30)return "注意";
  return "軽度";
}
function isWeak(n){
  return manualWeak.has(n) || weaknessScore(n)>=30;
}
function switchView(id){
  ["setup","test","results","history","weaklist"].forEach(x=>$(x).classList.toggle("hidden",x!==id));
  $("tabHome").classList.toggle("active",["setup","test","results"].includes(id));
  $("tabWeak").classList.toggle("active",id==="weaklist");
  $("tabStats").classList.toggle("active",id==="history");
  window.scrollTo({top:0,behavior:"smooth"});
}
function buildPool(){
  const mode=$("mode").value, start=+$("startNo").value, end=+$("endNo").value;
  let pool=words.filter(x=>x.number>=start&&x.number<=end);
  if(mode==="weak") pool=pool.filter(x=>isWeak(x.number));
  if(mode==="qmark") pool=pool.filter(x=>qhistory.has(x.number));
  if(mode==="never") pool=pool.filter(x=>statFor(x.number).attempts===0);
  if(mode==="wrong2") pool=pool.filter(x=>statFor(x.number).wrong>=2);
  if($("order").value==="random") pool=shuffle([...pool]);
  return pool.slice(0,Math.max(1,+$("count").value||100));
}
function startTest(custom=null, restoredAnswers=null, restoredRemainingMs=null){
  clearInterval(timerId);
  current = custom || buildPool();
  if(!current.length){alert("条件に合う単語がありません。");return}

  $("questions").innerHTML=current.map((x,i)=>`
    <div class="qrow unanswered" id="row${i}">
      <div class="qnum">${x.number}</div>
      <div class="word">${escapeHtml(x.word)}</div>
      <input id="a${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="日本語">
    </div>`).join("");

  document.querySelectorAll("#questions input").forEach((el,i)=>{
    if(restoredAnswers && restoredAnswers[i]) el.value=restoredAnswers[i];
    el.addEventListener("input",()=>{updateProgress();queueDraftSave()});
    el.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        const next=$("a"+(i+1));
        if(next){next.focus();next.scrollIntoView({block:"center",behavior:"smooth"})}
      }
    });
  });

  switchView("test");
  updateProgress();

  const mins=+$("minutes").value||0;
  if(restoredRemainingMs!=null && restoredRemainingMs>0){
    endAt=Date.now()+restoredRemainingMs;
    tick();timerId=setInterval(tick,250);
  }else if(mins>0){
    endAt=Date.now()+mins*60000;
    tick();timerId=setInterval(tick,250);
  }else{
    endAt=null;$("timerTop").textContent="";
  }
  setTimeout(()=>$("a0")?.focus(),80);
  saveDraft();
}
function getAnswers(){
  return current.map((_,i)=>$("a"+i)?.value||"");
}
function updateProgress(){
  const answers=getAnswers();
  const answered=answers.filter(x=>normalize(x)!=="").length;
  const unanswered=current.length-answered;
  $("progressText").textContent=`${answered}/${current.length}回答`;
  $("unansweredTop").textContent=`未回答 ${unanswered}`;
  $("progressFill").style.width=`${Math.round(answered/current.length*100)}%`;
  answers.forEach((v,i)=>{
    const row=$("row"+i);
    row?.classList.toggle("answered",normalize(v)!=="");
    row?.classList.toggle("unanswered",normalize(v)==="");
  });
}
function queueDraftSave(){
  clearTimeout(autosaveTimer);
  $("saveState").textContent="保存中…";
  autosaveTimer=setTimeout(saveDraft,250);
}
function saveDraft(){
  if(!current.length)return;
  const draft={
    words:current.map(x=>x.number),
    answers:getAnswers(),
    savedAt:new Date().toISOString(),
    remainingMs:endAt?Math.max(0,endAt-Date.now()):null,
    settings:{
      startNo:$("startNo").value,endNo:$("endNo").value,count:$("count").value,
      minutes:$("minutes").value,order:$("order").value,mode:$("mode").value
    }
  };
  localStorage.setItem(STORAGE.draft,JSON.stringify(draft));
  $("saveState").textContent="保存済み";
  refreshResumeBox();
}
function clearDraft(){
  localStorage.removeItem(STORAGE.draft);
  refreshResumeBox();
}
function refreshResumeBox(){
  const d=loadJSON(STORAGE.draft,null);
  $("resumeBox").classList.toggle("hidden",!d);
}
function resumeDraft(){
  const d=loadJSON(STORAGE.draft,null);
  if(!d)return;
  Object.entries(d.settings||{}).forEach(([k,v])=>{if($(k))$(k).value=v});
  const pool=d.words.map(n=>words.find(w=>w.number===n)).filter(Boolean);
  startTest(pool,d.answers,d.remainingMs);
}
function tick(){
  const left=Math.max(0,endAt-Date.now()), sec=Math.ceil(left/1000);
  $("timerTop").textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
  if(left<=0){clearInterval(timerId);submitTest(true)}
}
function submitTest(auto=false){
  const answers=getAnswers();
  const unanswered=answers.filter(x=>normalize(x)==="").length;
  if(!auto && unanswered>0 && !confirm(`未回答が${unanswered}問あります。このまま採点しますか？`)) return;

  clearInterval(timerId);
  $("timerTop").textContent="";
  $("unansweredTop").textContent="";

  currentRows=current.map((x,i)=>{
    const raw=answers[i].trim();
    const hasQ=/[？?]\s*$/.test(raw);
    const g=grade(raw,x.answers);
    return {...x,raw,hasQ,grade:g};
  });

  for(const r of currentRows){
    const s=statFor(r.number);
    s.attempts++;
    if(r.grade==="○")s.correct++;
    if(r.grade==="△")s.partial++;
    if(r.grade==="×")s.wrong++;
    s.lastGrade=r.grade;
    s.lastAnswer=r.raw;
    s.lastTested=new Date().toISOString();
    if(r.grade==="○"){
      s.correctStreak=(s.correctStreak||0)+1;
      if((s.correctStreak||0)>=3 && !manualWeak.has(r.number)) removedWeak.add(r.number);
    }else{
      s.correctStreak=0;
      s.lastMistakeAt=s.lastTested;
      removedWeak.delete(r.number);
    }
    if(r.hasQ)qhistory.add(r.number); else qhistory.delete(r.number);
  }

  const counts={"○":0,"△":0,"×":0};
  currentRows.forEach(r=>counts[r.grade]++);
  lastBad=currentRows.filter(r=>r.grade!=="○");
  sessions.push({
    date:new Date().toISOString(),
    count:currentRows.length,
    correct:counts["○"],partial:counts["△"],wrong:counts["×"]
  });
  saveCore();
  clearDraft();

  $("stats").textContent=
    `○ ${counts["○"]} / △ ${counts["△"]} / × ${counts["×"]}　正答率 ${Math.round(counts["○"]/currentRows.length*100)}%`
    +(auto?"（時間切れで自動提出）":"");

  const qrows=currentRows.filter(r=>r.grade==="○"&&r.hasQ);
  $("reviewQ").classList.toggle("hidden",!qrows.length);
  $("qmarkResults").innerHTML=qrows.map(renderResult).join("");
  activeFilter="all";setActiveTab();
  renderBadResults();
  switchView("results");
}
function renderBadResults(){
  const rows=lastBad.filter(r=>activeFilter==="all"||r.grade===activeFilter);
  $("badResults").innerHTML=rows.length?rows.map(renderResult).join(""):"該当する項目はありません。";
}
function renderResult(r){
  const cls=r.grade==="×"?"bad":r.grade==="△"?"mid":"qmark";
  return `<div class="result ${cls}" data-n="${r.number}">
    <div><span class="badge">${r.grade}</span><b>${r.number} ${escapeHtml(r.word)}</b></div>
    <div>あなたの回答：${escapeHtml(r.raw)||"（空欄）"}</div>
    <div>模範解答：${r.answers.map(escapeHtml).join("／")}</div>
    <div class="result-meta">この判定は現在、登録済み語義との照合です。</div>
    <div class="actions">
      <button class="secondary" onclick="overrideGrade(${r.number},'○')">○に変更</button>
      <button class="secondary" onclick="overrideGrade(${r.number},'△')">△に変更</button>
      <button class="secondary" onclick="overrideGrade(${r.number},'×')">×に変更</button>
    </div>
  </div>`;
}
function overrideGrade(n,newGrade){
  const row=currentRows.find(r=>r.number===n);
  if(!row || row.grade===newGrade)return;
  const s=statFor(n);
  if(row.grade==="○")s.correct=Math.max(0,s.correct-1);
  if(row.grade==="△")s.partial=Math.max(0,s.partial-1);
  if(row.grade==="×")s.wrong=Math.max(0,s.wrong-1);
  if(newGrade==="○")s.correct++;
  if(newGrade==="△")s.partial++;
  if(newGrade==="×")s.wrong++;
  row.grade=newGrade;s.lastGrade=newGrade;
  if(newGrade==="○"){
    s.correctStreak=(s.correctStreak||0)+1;
  }else{
    s.correctStreak=0;
    s.lastMistakeAt=new Date().toISOString();
    removedWeak.delete(n);
  }
  lastBad=currentRows.filter(r=>r.grade!=="○");
  saveCore();
  renderBadResults();
}
function setActiveTab(){
  $("tabAll").classList.toggle("active",activeFilter==="all");
  $("tabMid").classList.toggle("active",activeFilter==="△");
  $("tabBad").classList.toggle("active",activeFilter==="×");
}

function formatDate(iso){
  if(!iso)return "記録なし";
  const d=new Date(iso);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function getWeakRows(){
  let rows=words.map(w=>({w,s:statFor(w.number),score:weaknessScore(w.number)}))
    .filter(x=>isWeak(x.w.number));
  const filter=$("weakFilter")?.value||"all";
  if(filter==="severe")rows=rows.filter(x=>x.score>=70);
  if(filter==="manual")rows=rows.filter(x=>manualWeak.has(x.w.number));
  const sort=$("weakSort")?.value||"score";
  rows.sort((a,b)=>{
    if(sort==="recent")return new Date(b.s.lastMistakeAt||0)-new Date(a.s.lastMistakeAt||0);
    if(sort==="wrong")return b.s.wrong-a.s.wrong || b.score-a.score;
    if(sort==="number")return a.w.number-b.w.number;
    return b.score-a.score || b.s.wrong-a.s.wrong;
  });
  return rows;
}
function renderWeakList(){
  const rows=getWeakRows();
  $("weakSummary").textContent=`${rows.length}語を表示`;
  $("weakListBody").innerHTML=rows.length?rows.map(({w,s,score})=>`
    <div class="weak-card">
      <div class="weak-head">
        <div>
          <div class="weak-title">${w.number} ${escapeHtml(w.word)}</div>
          <div class="small">${w.answers.map(escapeHtml).join("／")}</div>
        </div>
        <div class="weak-score">${weakLabel(score)} ${score}</div>
      </div>
      <div class="weak-bar"><div style="width:${score}%"></div></div>
      <div class="weak-meta">
        × ${s.wrong}回　△ ${s.partial}回　○ ${s.correct}回<br>
        直近のミス：${formatDate(s.lastMistakeAt)}　連続正解：${s.correctStreak||0}回
        ${manualWeak.has(w.number)?"　固定登録中":""}
      </div>
      <div class="weak-controls">
        <button class="secondary" onclick="testOneWeak(${w.number})">1問テスト</button>
        <button class="secondary" onclick="toggleManualWeak(${w.number})">${manualWeak.has(w.number)?"固定解除":"苦手に固定"}</button>
        <button class="danger" onclick="removeWeak(${w.number})">消去</button>
      </div>
    </div>`).join(""):`<div class="card empty-state">条件に合う苦手単語はありません。</div>`;
}
function showWeakList(){
  renderWeakList();
  switchView("weaklist");
}
function toggleManualWeak(n){
  if(manualWeak.has(n))manualWeak.delete(n);else{manualWeak.add(n);removedWeak.delete(n)}
  saveCore();renderWeakList();
}
function removeWeak(n){
  if(!confirm("この単語を苦手リストから消去しますか？\\n履歴自体は残ります。"))return;
  manualWeak.delete(n);removedWeak.add(n);saveCore();renderWeakList();
}
function testOneWeak(n){
  const w=words.find(x=>x.number===n);
  if(w)startTest([w]);
}

function showHistory(){
  const all=words.map(w=>({w,s:statFor(w.number)})).filter(x=>x.s.attempts>0);
  const attempts=all.reduce((a,x)=>a+x.s.attempts,0);
  const correct=all.reduce((a,x)=>a+x.s.correct,0);
  $("historySummary").textContent=
    `学習済み ${all.length}語　総回答 ${attempts}回　○率 ${attempts?Math.round(correct/attempts*100):0}%`;
  $("historyBody").innerHTML=all
    .sort((a,b)=>(b.s.wrong+b.s.partial)-(a.s.wrong+a.s.partial)||a.w.number-b.w.number)
    .map(({w,s})=>`<tr>
      <td><b>${w.number} ${escapeHtml(w.word)}</b></td>
      <td>${weaknessScore(w.number)}</td>
      <td>${s.attempts}</td><td>${s.correct}</td><td>${s.partial}</td><td>${s.wrong}</td>
      <td>${escapeHtml(s.lastGrade||"-")}</td>
    </tr>`).join("");
  switchView("history");
}
function downloadJSON(name,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

$("startBtn").onclick=()=>startTest();
$("submitBtn").onclick=()=>submitTest(false);
$("backBtn").onclick=()=>switchView("setup");
$("retryWeak").onclick=()=>{
  const pool=lastBad.map(r=>words.find(w=>w.number===r.number)).filter(Boolean);
  startTest(pool);
};
$("jumpFirstBlank").onclick=()=>{
  const i=getAnswers().findIndex(x=>normalize(x)==="");
  if(i<0){alert("未回答はありません。");return}
  $("a"+i).focus();$("a"+i).scrollIntoView({block:"center",behavior:"smooth"});
};
$("saveExitBtn").onclick=()=>{saveDraft();clearInterval(timerId);$("timerTop").textContent="";$("unansweredTop").textContent="";switchView("setup")};
$("resumeBtn").onclick=resumeDraft;
$("discardDraftBtn").onclick=()=>{if(confirm("途中保存データを破棄しますか？"))clearDraft()};
$("showHistoryBtn").onclick=showHistory;
$("historyBackBtn").onclick=()=>switchView("setup");

$("tabAll").onclick=()=>{activeFilter="all";setActiveTab();renderBadResults()};
$("tabMid").onclick=()=>{activeFilter="△";setActiveTab();renderBadResults()};
$("tabBad").onclick=()=>{activeFilter="×";setActiveTab();renderBadResults()};

$("exportAllBtn").onclick=()=>downloadJSON("target_batch_test_backup.json",{
  version:3,exportedAt:new Date().toISOString(),words,stats,qmark:[...qhistory],sessions,manualWeak:[...manualWeak],removedWeak:[...removedWeak]
});
$("exportWordsBtn").onclick=()=>downloadJSON("target_words.json",words);
$("importAllBtn").onclick=()=>$("fileInputAll").click();
$("importWordsBtn").onclick=()=>$("fileInputWords").click();

$("fileInputAll").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.words)||typeof d.stats!=="object")throw 0;
    words=d.words;stats=d.stats||{};qhistory=new Set(d.qmark||[]);sessions=d.sessions||[];manualWeak=new Set(d.manualWeak||[]);removedWeak=new Set(d.removedWeak||[]);
    saveCore();alert("全データを復元しました。");
  }catch{alert("バックアップ形式が正しくありません。")}
  e.target.value="";
};
$("fileInputWords").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d)||!d.every(x=>x.number&&x.word&&Array.isArray(x.answers)))throw 0;
    words=d;saveCore();alert(`${d.length}語を読み込みました。`);
  }catch{alert("単語JSONの形式が正しくありません。")}
  e.target.value="";
};
$("clearHistory").onclick=()=>{
  if(confirm("学習履歴・苦手履歴・？履歴をすべて消しますか？")){
    stats={};qhistory.clear();sessions=[];manualWeak.clear();removedWeak.clear();saveCore();clearDraft();alert("消去しました。");
  }
};


$("tabHome").onclick=()=>switchView("setup");
$("tabWeak").onclick=showWeakList;
$("tabStats").onclick=showHistory;
$("weakSort").onchange=renderWeakList;
$("weakFilter").onchange=renderWeakList;
$("refreshWeakBtn").onclick=renderWeakList;
$("testWeakListBtn").onclick=()=>{
  const pool=getWeakRows().map(x=>x.w);
  if(!pool.length){alert("表示中の苦手単語がありません。");return}
  startTest(pool.slice(0,Math.max(1,+$("count").value||100)));
};

window.addEventListener("beforeunload",()=>{if(!$("test").classList.contains("hidden"))saveDraft()});
refreshResumeBox();
</script>
</body>
